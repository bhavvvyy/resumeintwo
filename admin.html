<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeInTwo – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:#111;font-size:14px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d8d8d8;padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.4px;margin-right:auto}
.brand span{color:#2563EB}
input{padding:9px 11px;border:1.5px solid #d8d8d8;border-radius:8px;min-width:260px;font:inherit}
input:focus{outline:0;border-color:#111}
button{border:1.5px solid #111;background:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500}
button:hover{background:#eee}
button.p{background:#2563EB;border-color:#2563EB;color:#fff}
button.p:hover{background:#1D4ED8}
.wrap{padding:24px 28px;overflow-x:auto;max-width:1240px;margin:0 auto}
.count{color:#666;font-size:12.5px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d8d8d8}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e4e4e4;white-space:nowrap}
th{background:#f5f5f5;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#555}
tr:hover td{background:#f5f5f5}
.m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.m.on{display:flex}
.card{background:#fff;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:24px;border-radius:10px}
.card h2{margin:0 0 4px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid #2563EB;padding-bottom:2px;margin:16px 0 6px;color:#2563EB}
.card ul{margin:2px 0;padding-left:18px}
.err{color:#111;padding:12px 28px;font-weight:600}
.ft{background:#000;color:#fff;text-align:center;padding:28px 16px;line-height:1.8}
.ft a{color:#fff;border:1.5px solid #2563EB;border-radius:6px;padding:4px 12px;display:inline-block;margin-top:4px}
</style>
</head>
<body>
<header><div class="brand">ResumeInTwo <span>Admin</span></div><input id="q" placeholder="Search by name or email"><button id="demo" class="p">Load Demo Data</button></header>
<div class="err" id="err"></div>
<div class="wrap"><p class="count" id="count"></p><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Job Title</th><th>City</th><th>Saved On</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="m" id="m"><div class="card" id="card"></div></div>
<footer class="ft"><div><b>ResumeInTwo</b></div><div>Made by Bhavy Patel</div><div>Contact: <a href="mailto:bhavypatelwebstudio@gmail.com">bhavypatelwebstudio@gmail.com</a></div></footer>
<script>
const SUPABASE_URL = "https://vopgoxpujfmgyxjefqhs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvcGdveHB1amZtZ3l4amVmcWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NjY2OTIsImV4cCI6MjEwOTU0MjY5Mn0.vskX6oFmdFvgFFP__zdigM1mmPyhzZNMwo2VeeWebho";
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "resumeintwo_resumes";
let all = [];
function localAll(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(x){ return []; } }
async function load(){
  if (SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.startsWith("PASTE")) {
    try{
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await db.from("resumes").select("*").order("created_at", {ascending:false});
      if (error) throw error;
      all = data || [];
    }catch(x){ $("err").textContent = "Supabase error: " + (x.message||x) + " — showing local saves."; all = localAll(); }
  } else {
    all = localAll();
    if (!all.length) $("err").textContent = "No resumes saved yet. Fill one in ResumeInTwo and click Download PDF, or click Load Demo Data to see a sample.";
  }
  draw();
}
function draw(){
  const q = $("q").value.trim().toLowerCase();
  const list = all.filter(r => !q || (r.name||"").toLowerCase().includes(q) || (r.email||"").toLowerCase().includes(q));
  $("count").textContent = list.length + " resume(s) saved";
  $("rows").innerHTML = list.length ? list.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.job_title)}</td><td>${esc(r.city)}</td><td>${r.created_at ? new Date(r.created_at).toLocaleString() : ""}</td><td><button data-id="${r.id}">View</button></td></tr>`).join("") : `<tr><td colspan="7">No resumes found.</td></tr>`;
}
$("q").addEventListener("input", draw);
$("rows").addEventListener("click", e => {
  const id = e.target.dataset.id; if (!id) return;
  const r = all.find(x => String(x.id) === id); if (!r) return;
  const bl = a => (a||[]).filter(x=>x && String(x).trim()).map(x=>`<li>${esc(x)}</li>`).join("");
  const exp = (r.experience||[]).map(x=>`<p><b>${esc(x.title)}</b>, ${esc(x.company)} (${esc(x.start)} – ${x.cur?"Present":esc(x.end)})</p><ul>${bl(typeof x.b==="string"?x.b.split("\n"):x.b)}</ul>`).join("");
  $("card").innerHTML = `<h2>${esc(r.name)}</h2><div>${esc(r.job_title)}</div><div>${[r.email,r.phone,r.city].filter(Boolean).map(esc).join("  |  ")}</div>
  <h3>Summary</h3><p>${esc(r.summary)}</p>
  <h3>Experience</h3>${exp}
  <h3>Education</h3>${(r.education||[]).map(x=>`<p><b>${esc(x.degree)}</b>, ${esc(x.college)} (${esc(x.year)}) ${esc(x.score||"")}</p>`).join("")}
  <h3>Skills</h3><p>${(r.skills||[]).map(esc).join(", ")}</p><p><button id="x">Close</button></p>`;
  $("m").classList.add("on");
});
$("m").addEventListener("click", e => { if (e.target.id === "m" || e.target.id === "x") $("m").classList.remove("on"); });
$("demo").addEventListener("click", () => {
  const demo = {id:Date.now(),name:"Rohan Mehta",email:"rohan@example.com",phone:"+91 90000 00002",job_title:"Data Analyst",city:"Bengaluru",summary:"Analyst who cleans data, writes clear SQL queries and builds dashboards that help teams decide faster.",experience:[{title:"Data Analyst",company:"Metric Insights Pvt Ltd",start:"Aug 2021",end:"",cur:true,b:"Wrote SQL queries that cut weekly report time by 30%\nBuilt Power BI dashboards used by a team of 25 people"}],education:[{degree:"B.Sc. Statistics",college:"Lakeview College",year:"2021",score:""}],skills:["Excel","SQL","Python","Power BI","Data Cleaning"],created_at:new Date().toISOString()};
  const cur = localAll(); cur.unshift(demo); localStorage.setItem(KEY, JSON.stringify(cur.slice(0,200)));
  $("err").textContent = ""; all = cur; draw();
});
load();
</script>
</body>
</html>
